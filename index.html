<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPM Site Management — กำลังนำทาง...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Sarabun', sans-serif;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .router-card {
      background: #1e293b;
      border: 1.5px solid #334155;
      border-radius: 16px;
      padding: 3rem 2.5rem;
      text-align: center;
      max-width: 360px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .brand-icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
    }
    .brand-title {
      font-size: 1rem;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 1.75rem;
    }
    .spinner-ring {
      width: 52px;
      height: 52px;
      border: 4px solid #334155;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
      margin: 0 auto 1.5rem auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-text {
      font-size: 1.05rem;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 0.5rem;
    }
    .status-sub {
      font-size: 0.8rem;
      color: #64748b;
    }
    .error-box {
      display: none;
      background: #1a1212;
      border: 1.5px solid #dc2626;
      border-radius: 10px;
      padding: 1rem;
      margin-top: 1.5rem;
    }
    .error-text {
      font-size: 0.82rem;
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <div class="router-card">
    <div class="brand-icon">🏗️</div>
    <div class="brand-title">CPM Construction Site System</div>
    <div class="spinner-ring" id="spinner"></div>
    <div class="status-text" id="status-text">กำลังตรวจสอบสิทธิ์การใช้งาน...</div>
    <div class="status-sub" id="status-sub">ระบบกำลังนำคุณไปยังหน้าที่ตรงตามระดับสิทธิ์</div>
    <div class="error-box" id="error-box">
      <div class="error-text" id="error-text">ไม่พบข้อมูลผู้ใช้ในระบบ กรุณาติดต่อผู้ดูแลระบบ</div>
    </div>
  </div>

  <script>
    (function() {
      var GAS_URL = 'https://script.google.com/macros/s/AKfycbzT9MF8xOPiiGZvGbZRZB1T3erYYrOLGxhgfegsnJySMIlRlyNmIWmfNCOI_fdVicKjow/exec';

      function setStatus(text, sub) {
        var el = document.getElementById('status-text');
        var subEl = document.getElementById('status-sub');
        if (el) el.textContent = text;
        if (subEl && sub !== undefined) subEl.textContent = sub;
      }

      function showError(msg) {
        var box = document.getElementById('error-box');
        var txt = document.getElementById('error-text');
        var spinner = document.getElementById('spinner');
        if (spinner) spinner.style.display = 'none';
        if (box) box.style.display = 'block';
        if (txt) txt.textContent = msg || 'เกิดข้อผิดพลาด กรุณาลองใหม่หรือติดต่อผู้ดูแลระบบ';
      }

      // Determine target page based on level string
      function getTargetPage(lv, role) {
        var lvStr = String(lv || '').toLowerCase().trim();
        var roleStr = String(role || '').toLowerCase().trim();
        if (lvStr === '2' || lvStr === 'lv2' || roleStr.indexOf('ผู้รับเหมา') !== -1 || roleStr.indexOf('subcontractor') !== -1 || roleStr.indexOf('sub') !== -1) {
          return 'weekly-plan.html';
        }
        if (lvStr === '3' || lvStr === 'lv3' || roleStr.indexOf('pm') !== -1 || roleStr.indexOf('ผู้จัดการ') !== -1 || roleStr.indexOf('project manager') !== -1) {
          return 'pm-center.html';
        }
        // Default: LV1 foreman
        return 'foreman.html';
      }

      function doRedirect(page, query) {
        // Preserve original query string when redirecting
        var sep = query && query.length > 1 ? query : '';
        window.location.replace(page + sep);
      }

      // Save level to localStorage for future fast-routing
      function cacheLevelLocally(lv, uid, name, role, company, prj, prjName, avatar) {
        try {
          if (lv) localStorage.setItem('site_line_level', String(lv));
          if (uid) localStorage.setItem('site_line_uid', uid);
          if (name) localStorage.setItem('site_line_name', name);
          if (role) localStorage.setItem('site_line_role', role);
          if (company) localStorage.setItem('site_sub_name', company);
          if (prj) localStorage.setItem('site_project_id', prj);
          if (prjName) localStorage.setItem('site_project_name', prjName);
        } catch(e) {}
      }

      function main() {
        var urlParams = new URLSearchParams(window.location.search);
        var lv = urlParams.get('lv') || '';
        var role = urlParams.get('role') || '';
        var uid = urlParams.get('uid') || '';
        var name = urlParams.get('name') || '';
        var company = urlParams.get('company') || '';
        var prj = urlParams.get('prj') || '';
        var prjName = urlParams.get('prjName') || '';
        var avatar = urlParams.get('avatar') || '';
        var query = window.location.search;

        // === CASE 1: Level or Role is directly in URL (fastest path — used by LINE webhook links) ===
        if (lv || role) {
          var page = getTargetPage(lv, role);
          cacheLevelLocally(lv, uid, name, role, company, prj, prjName, avatar);
          setStatus('กำลังเข้าสู่ระบบ...');
          doRedirect(page, query);
          return;
        }

        // === CASE 2: Only UID given (lookup from GAS to get level) ===
        if (uid) {
          setStatus('กำลังตรวจสอบสิทธิ์ผู้ใช้...', 'ดึงข้อมูลระดับสิทธิ์จากระบบ Site_Users');
          var lookupUrl = GAS_URL + '?action=get_user&uid=' + encodeURIComponent(uid) + '&_t=' + Date.now();
          fetch(lookupUrl, { method: 'GET' })
            .then(function(res) { return res.json(); })
            .then(function(data) {
              if (data && data.status === 'success' && data.user) {
                var u = data.user;
                cacheLevelLocally(u.level, u.uid, u.displayName, u.role, u.company, u.projectId, u.projectName, u.avatar);
                var newQuery = '?uid=' + encodeURIComponent(u.uid || uid) +
                  '&name=' + encodeURIComponent(u.displayName || name) +
                  '&role=' + encodeURIComponent(u.role || '') +
                  '&lv=' + encodeURIComponent(u.level || '') +
                  '&company=' + encodeURIComponent(u.company || '') +
                  '&prj=' + encodeURIComponent(u.projectId || '') +
                  '&prjName=' + encodeURIComponent(u.projectName || '');
                var page = getTargetPage(u.level, u.role);
                setStatus('กำลังนำคุณเข้าสู่ระบบ...');
                doRedirect(page, newQuery);
              } else {
                // UID found in URL but not in Site_Users → default to foreman
                cacheLevelLocally('1', uid, name, role, company, prj, prjName, avatar);
                doRedirect('foreman.html', query);
              }
            })
            .catch(function() {
              // Network error → try cached level
              var cachedLv = '';
              try { cachedLv = localStorage.getItem('site_line_level') || ''; } catch(e) {}
              var page = getTargetPage(cachedLv, '');
              doRedirect(page, query);
            });
          return;
        }

        // === CASE 3: No URL params — check localStorage cache ===
        try {
          var cachedLv = localStorage.getItem('site_line_level') || '';
          var cachedRole = localStorage.getItem('site_line_role') || '';
          if (cachedLv || cachedRole) {
            var page = getTargetPage(cachedLv, cachedRole);
            var cachedUid = localStorage.getItem('site_line_uid') || '';
            var cachedName = localStorage.getItem('site_line_name') || '';
            var cachedCompany = localStorage.getItem('site_sub_name') || '';
            var cachedPrj = localStorage.getItem('site_project_id') || '';
            var cachedPrjName = localStorage.getItem('site_project_name') || '';
            var cachedQuery = '';
            if (cachedUid) {
              cachedQuery = '?uid=' + encodeURIComponent(cachedUid) +
                '&name=' + encodeURIComponent(cachedName) +
                '&lv=' + encodeURIComponent(cachedLv) +
                '&company=' + encodeURIComponent(cachedCompany) +
                '&prj=' + encodeURIComponent(cachedPrj) +
                '&prjName=' + encodeURIComponent(cachedPrjName);
            }
            setStatus('กำลังเข้าสู่ระบบจากข้อมูลที่บันทึกไว้...');
            doRedirect(page, cachedQuery);
            return;
          }
        } catch(e) {}

        // === CASE 4: Absolute fallback — show info page for admin or testing ===
        // Only show error/message, no cards to select
        setStatus('ไม่พบข้อมูลการเข้าสู่ระบบ', 'กรุณาเข้าระบบผ่านลิงก์ที่ส่งมาทาง LINE เท่านั้น');
        var spinner = document.getElementById('spinner');
        if (spinner) spinner.style.display = 'none';
        showError('กรุณาเข้าระบบผ่านลิงก์ที่ระบบส่งให้ทาง LINE เท่านั้น ห้ามเปิดหน้านี้โดยตรง\n\nหากมีปัญหา กรุณาติดต่อผู้ดูแลระบบ (ผู้จัดการโครงการ)');
      }

      // Run immediately
      main();
    })();
  </script>
</body>
</html>
